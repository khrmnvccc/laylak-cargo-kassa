<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0d2b5e" />
<title>Laylak Cargo · Buyurtma</title>
<link rel="icon" href="/brand/laylak-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<!-- The page a client opens by scanning the sticker on a parcel. The order is read from the link's
     #code.secret part, which never reaches server logs; the page only shows what /api/public/orders returns. -->
<style>
  :root { --navy: #0d2b5e; --orange: #f39a1e; --ink: #151a23; --ink2: #5b6472; --line: #e6e8ee; --soft: #f5f6f9; --bg: #eef1f6; --card: #fff;
          --ok: #138a4b; --ok-bg: #e8f7ef; --wait: #a35f00; --wait-bg: #fff4e2; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left)); display: grid; gap: 14px; }
  header { display: flex; align-items: center; gap: 12px; padding: 4px 2px; }
  header img { width: 64px; height: auto; mix-blend-mode: multiply; }
  header b { display: block; color: var(--navy); font-size: 19px; letter-spacing: .06em; }
  header span { color: var(--ink2); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  h1 { font-size: 18px; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
  h1 svg { color: var(--navy); flex: none; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  th, td { padding: 12px; text-align: left; vertical-align: middle; border-bottom: 1px solid var(--line); }
  tr:last-child th, tr:last-child td { border-bottom: 0; }
  th { width: 44%; background: var(--soft); color: var(--ink2); font-weight: 500; border-right: 1px solid var(--line); }
  td { font-weight: 600; word-break: break-word; }
  .num { font-variant-numeric: tabular-nums; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; border: 1px solid currentColor; }
  .badge.ok { color: var(--ok); background: var(--ok-bg); }
  .badge.wait { color: var(--wait); background: var(--wait-bg); }
  .due { margin-top: 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px; border-radius: 12px; background: var(--navy); color: #fff; }
  .due span { opacity: .8; font-size: 14px; }
  .due b { font-size: 22px; }
  .note { margin: 12px 0 0; color: var(--ink2); font-size: 13px; }
  .promo h2 { margin: 0 0 4px; font-size: 17px; color: var(--navy); }
  .promo p { margin: 0; color: var(--ink2); font-size: 14px; }
  .links { display: grid; gap: 8px; margin-top: 14px; }
  .links a { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; text-decoration: none; font-weight: 600; color: var(--ink); background: var(--soft); border: 1px solid var(--line); }
  .links a.main { background: #229ed9; border-color: #229ed9; color: #fff; }
  .links a small { margin-left: auto; font-weight: 500; color: inherit; opacity: .75; }
  .links svg { flex: none; }
  .empty { text-align: center; padding: 28px 18px; }
  .empty b { display: block; font-size: 17px; margin-bottom: 6px; }
  .empty p { margin: 0; color: var(--ink2); }
  footer { text-align: center; color: var(--ink2); font-size: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <img src="/brand/laylak-logo.png" alt="Laylak Cargo" width="64" height="25" />
    <div><b>LAYLAK CARGO</b><span>Buyurtmangiz holati</span></div>
  </header>

  <section class="card" id="order" aria-live="polite"><div class="empty"><p>Yuklanmoqda…</p></div></section>

  <section class="card">
    <div class="promo">
      <h2>Laylak Cargo bilan bogʻlaning</h2>
      <p>Savolingiz boʻlsa yoki yangi buyurtma bermoqchi boʻlsangiz, bizga yozing.</p>
    </div>
    <div class="links">
      <a class="main" href="https://t.me/laylak_cargo" target="_blank" rel="noopener">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.9 4.3 18.8 19c-.2 1-.8 1.3-1.7.8l-4.6-3.4-2.2 2.1c-.2.2-.5.5-1 .5l.3-4.7 8.6-7.8c.4-.3-.1-.5-.6-.2L6.9 12.9l-4.6-1.4c-1-.3-1-1 .2-1.5L20.5 3c.8-.3 1.6.2 1.4 1.3Z"/></svg>
        Adminga yozish <small>@laylak_cargo</small>
      </a>
      <a href="https://t.me/laylakcargo_china" target="_blank" rel="noopener">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        Telegram kanalimiz <small>@laylakcargo_china</small>
      </a>
      <a href="https://laylak-cargo.vercel.app/" target="_blank" rel="noopener">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        Saytimiz <small>laylak-cargo.vercel.app</small>
      </a>
    </div>
  </section>

  <footer>© Laylak Cargo</footer>
</main>
<script>
(function () {
  var box = document.getElementById('order');
  var ref = decodeURIComponent(location.hash.slice(1)).trim();
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); };
  var money = function (n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' soʻm'; };
  var day = function (d) { return d ? d.split('-').reverse().join('.') : ''; };
  var when = function (t) {
    try {
      var p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Tashkent', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date(t));
      var g = function (k) { return (p.find(function (x) { return x.type === k; }) || {}).value; };
      return g('day') + '.' + g('month') + '.' + g('year') + '; ' + g('hour') + ':' + g('minute');
    } catch (e) { return ''; }
  };
  var empty = function (title, text) { box.innerHTML = '<div class="empty"><b>' + esc(title) + '</b><p>' + esc(text) + '</p></div>'; };
  var ICON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>';

  if (!/^77\d{8}\.[0-9a-f]{20}$/.test(ref)) { empty('Buyurtma topilmadi', 'Stikerdagi QR kodni qaytadan skaner qiling.'); return; }
  fetch('/api/public/orders/' + encodeURIComponent(ref), { credentials: 'omit', cache: 'no-store' })
    .then(function (r) { return r.json().then(function (body) { return { ok: r.ok, body: body }; }); })
    .then(function (res) {
      if (!res.ok) { empty('Buyurtma topilmadi', 'Bu stiker bekor qilingan yoki notoʻgʻri. Savol boʻlsa, adminga yozing.'); return; }
      var o = res.body;
      var done = o.status === 'collected';
      var rows = [
        ['Buyurtma raqami', o.order_no ? '№ ' + o.order_no : ''],
        ['Holati', done
          ? '<span class="badge ok">✓ Olib ketildi</span>'
          : '<span class="badge wait">● Toʻlov kutilmoqda</span>', true],
        ['Mijoz ID', o.client_code],
        ['Mijoz', o.client_name],
        ['Usul', o.transport],
        ['Joylar soni', o.places ? o.places + ' ta' : ''],
        ['Vazn', o.weight != null ? o.weight + ' kg' : ''],
        ['Qabul qilingan sana', day(o.received_at)],
        done ? ['Olib ketilgan vaqt', when(o.paid_at)] : null,
      ].filter(function (r) { return r && r[1]; });
      box.innerHTML = '<h1>' + ICON + 'Buyurtma maʼlumotlari</h1>'
        + '<table>' + rows.map(function (r) { return '<tr><th>' + esc(r[0]) + '</th><td class="num">' + (r[2] ? r[1] : esc(r[1])) + '</td></tr>'; }).join('') + '</table>'
        + '<div class="due"><span>' + (done ? 'Toʻlangan' : 'Toʻlov summasi') + '</span><b class="num">' + esc(money(o.amount)) + '</b></div>'
        + (done ? '' : '<p class="note">Buyurtmani kassada toʻlov qilib olib ketishingiz mumkin. Stikerni kassirga koʻrsating.</p>');
    })
    .catch(function () { empty('Internet yoʻq', 'Sahifani birozdan keyin yangilang.'); });
})();
</script>
</body>
</html>
